<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VA Task Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --brand:#1f3864; --red:#dc2626; --green:#16a34a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  header { background:var(--brand); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header .who { font-size:12px; opacity:.85; }
  nav { display:flex; gap:4px; padding:8px 16px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav button { background:none; border:0; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:14px; color:var(--ink); }
  nav button.on { background:#e8edf6; color:var(--brand); font-weight:bold; }
  main { padding:16px; max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .stat .lbl { color:var(--muted); font-size:12px; } .stat .val { font-size:26px; font-weight:bold; margin-top:4px; } .stat .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .neg { color:var(--red); } .pos { color:var(--green); }
  h2 { font-size:15px; margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; white-space:nowrap; }
  .st-ns { background:#eef2f7; color:#374151; } .st-ip { background:#dbeafe; color:#1e40af; } .st-w { background:#fef3c7; color:#92400e; }
  .st-g { background:#fee2e2; color:#991b1b; } .st-d { background:#dcfce7; color:#166534; }
  .pr-High { background:#fee2e2; color:#991b1b; } .pr-Medium { background:#fef3c7; color:#92400e; } .pr-Low { background:#eef2f7; color:#374151; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
  input, select, textarea { font:inherit; padding:7px 9px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; }
  textarea { width:100%; min-height:70px; }
  .btn { background:var(--brand); color:#fff; border:0; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:14px; }
  .btn.sec { background:#e5e7eb; color:var(--ink); } .btn.danger { background:var(--red); } .btn.sm { padding:4px 8px; font-size:12px; }
  .row-actions { white-space:nowrap; } .muted { color:var(--muted); } .overdue { color:var(--red); font-weight:bold; }
  dialog { border:0; border-radius:12px; padding:0; width:min(560px,94vw); }
  dialog form { padding:18px; } dialog label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; } dialog input, dialog select { width:100%; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .gate { max-width:380px; margin:10vh auto; } .gate input { width:100%; margin-bottom:10px; }
  .err { color:var(--red); font-size:13px; min-height:18px; }
  .chartbox { position:relative; height:260px; }
  .hidden { display:none !important; }
  .saving { position:fixed; bottom:16px; right:16px; background:#111827; color:#fff; padding:8px 12px; border-radius:8px; font-size:13px; }
  @media (max-width:700px){ .hide-sm { display:none; } th, td { padding:6px 4px; } }
</style>
</head>
<body>

<div id="gate-login" class="card gate hidden">
  <h2>VA Task Dashboard</h2>
  <input id="li-user" placeholder="Username" autocomplete="username">
  <input id="li-pass" type="password" placeholder="Passcode" autocomplete="current-password">
  <div class="err" id="li-err"></div>
  <button class="btn" id="li-btn" style="width:100%">Sign in</button>
</div>



<div id="app" class="hidden">
  <header>
    <h1>VA Task Dashboard</h1>
    <span class="who" id="who"></span>
    <button class="btn sec sm" id="out-btn">Sign out</button>
  </header>
  <nav id="nav"></nav>
  <main>
    <section id="v-dashboard"></section>
    <section id="v-tasks" class="hidden"></section>
    <section id="v-time" class="hidden"></section>
    <section id="v-users" class="hidden"></section>
    <section id="v-settings" class="hidden"></section>
  </main>
</div>
<div id="saving" class="saving hidden">Saving…</div>

<dialog id="d-task"><form id="f-task">
  <h2 id="dt-title">Task</h2>
  <label>Task</label><input name="title" required>
  <div class="two"><div><label>Category</label><input name="category" list="cats"></div><div><label>Owner</label><select name="owner"></select></div></div>
  <div class="two"><div><label>Status</label><select name="status"></select></div><div><label>Priority</label><select name="priority"></select></div></div>
  <div class="two"><div><label>Due date</label><input name="due_date" type="date"></div><div><label>Waiting on (person)</label><input name="waiting_on"></div></div>
  <label>Notes</label><textarea name="notes"></textarea>
  <div class="actions">
    <button type="button" class="btn danger hidden" id="dt-del">Delete</button>
    <button type="button" class="btn sec" onclick="this.closest('dialog').close()">Cancel</button>
    <button class="btn">Save</button>
  </div>
</form></dialog>

<dialog id="d-time"><form id="f-time">
  <h2>Log time</h2>
  <label>Task</label><select name="task_id"></select>
  <div class="two"><div><label>Date</label><input name="entry_date" type="date" required></div><div><label>Minutes</label><input name="minutes" type="number" min="1" step="1" required></div></div>
  <div style="margin-top:6px">
    <button type="button" class="btn sec sm qm" data-m="5">+5</button> <button type="button" class="btn sec sm qm" data-m="10">+10</button>
    <button type="button" class="btn sec sm qm" data-m="15">+15</button> <button type="button" class="btn sec sm qm" data-m="30">+30</button>
    <button type="button" class="btn sec sm qm" data-m="60">+60</button>
  </div>
  <label>Category (for analytics)</label><input name="category" list="cats">
  <label>What was done</label><input name="note">
  <div class="actions"><button type="button" class="btn sec" onclick="this.closest('dialog').close()">Cancel</button><button class="btn">Save</button></div>
</form></dialog>
<datalist id="cats"></datalist>

<script>
/* ===== CONFIG ===== */
const GH_OWNER = 'gprivateai';
const GH_REPO = 'VAdashboard';
const GH_BRANCH = 'main';
const DATA_PATH = 'data.json';
/* ================== */

const OWNERS = ['Gerald', 'Dr. Ghiassi', 'Waiting on'];
const STATUSES = ['Not started', 'In progress', 'Waiting', 'Needs Dr. G', 'Done'];
const PRIORITIES = ['High', 'Medium', 'Low'];
const ST_CLASS = {'Not started':'st-ns','In progress':'st-ip','Waiting':'st-w','Needs Dr. G':'st-g','Done':'st-d'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DB = null, fileSha = null, me = null, view = 'dashboard', charts = {};
const filt = { q:'', status:'open', owner:'', category:'' };

/* ---------- storage helpers (wrapped: may be blocked) ---------- */
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} }, del(k){ try { localStorage.removeItem(k); } catch {} } };
const sess = { get(k){ try { return sessionStorage.getItem(k); } catch { return null; } }, set(k,v){ try { sessionStorage.setItem(k,v); } catch {} }, del(k){ try { sessionStorage.removeItem(k); } catch {} } };
const token = () => store.get('va_gh_token');

/* ---------- GitHub data ---------- */
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));
const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${DATA_PATH}`;
async function loadData() {
  const r = await fetch(`${DATA_PATH}?t=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error('Could not load data.json');
  DB = await r.json();
}
async function saveData(msg = 'Update dashboard data') {
  if (!token()) { alert('This device has no GitHub token, so changes cannot be saved. Add it in Settings.'); return false; }
  $('#saving').classList.remove('hidden');
  try {
    if (!fileSha) { const g = await fetch(`${apiUrl}?ref=${GH_BRANCH}`, { headers: { Authorization: `Bearer ${token()}` } }); if (g.ok) fileSha = (await g.json()).sha; }
    const r = await fetch(apiUrl, { method: 'PUT', headers: { Authorization: `Bearer ${token()}`, Accept: 'application/vnd.github+json' },
      body: JSON.stringify({ message: msg, content: b64enc(JSON.stringify(DB, null, 1)), sha: fileSha, branch: GH_BRANCH }) });
    const j = await r.json();
    if (!r.ok) { alert('Save failed: ' + (j.message || r.status) + (r.status === 409 ? '. Reload the page and try again.' : '')); return false; }
    fileSha = j.content.sha; return true;
  } finally { $('#saving').classList.add('hidden'); }
}

/* ---------- passcodes ---------- */
async function hash(user, pass) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`va-dash|${user.toLowerCase()}|${pass}`));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
function weekStart(s) { const d = parseD(s); const sd = Number(DB.settings.week_start_day ?? 1); d.setDate(d.getDate() - ((d.getDay() - sd + 7) % 7)); return ymd(d); }
const fmtD = s => s ? parseD(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

/* ---------- boot / auth ---------- */
async function boot() {
  try { await loadData(); } catch (e) { document.body.innerHTML = `<div class="card gate"><h2>Can't load data</h2><p>${esc(e.message)}</p></div>`; return; }
  if (!DB.users || !DB.users.length) { document.body.innerHTML = '<div class="card gate"><h2>Not set up yet</h2><p class="muted">No users in data.json.</p></div>'; return; }
  const u = sess.get('va_user'); me = DB.users.find(x => x.username === u && x.active !== false);
  if (!me) return show('#gate-login');
  startApp();
}
function show(id) { ['#gate-login', '#app'].forEach(x => $(x).classList.add('hidden')); $(id).classList.remove('hidden'); }
$('#li-btn').onclick = async () => {
  const user = $('#li-user').value.trim(), pass = $('#li-pass').value; $('#li-err').textContent = '';
  const u = DB.users.find(x => x.username.toLowerCase() === user.toLowerCase());
  if (!u || u.active === false || u.pass_hash !== await hash(u.username, pass)) return $('#li-err').textContent = 'Wrong username or passcode.';
  sess.set('va_user', u.username); me = u; startApp();
};
$('#li-pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('#li-btn').click(); });

$('#out-btn').onclick = () => { sess.del('va_user'); location.reload(); };
const isAdmin = () => me && me.role === 'admin';
const canEdit = () => false;  // read-only site: updates come from a new data.json upload

function startApp() {
  show('#app'); $('#who').textContent = `${me.name || me.username} · ${me.role}`;
  const items = [['dashboard', 'Dashboard'], ['tasks', 'Tasks']];
  if (isAdmin()) items.push(['time', 'Time log']);
  $('#nav').innerHTML = items.map(([k, l]) => `<button data-v="${k}">${l}</button>`).join('');
  $('#nav').onclick = e => { const v = e.target.dataset.v; if (v) { view = v; render(); } };
  render();
}
function render() {
  $('#cats').innerHTML = [...new Set(DB.tasks.map(x => x.category).filter(Boolean))].sort().map(c => `<option value="${esc(c)}">`).join('');
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
  $('#v-' + view).classList.remove('hidden');
  ({ dashboard: renderDashboard, tasks: renderTasks, time: renderTime, users: renderUsers, settings: renderSettings })[view]();
}
const newId = () => DB.next_id++;

/* ---------- hours ---------- */
function hoursSummary() {
  const S = DB.settings, budget = Number(S.weekly_budget_hours ?? 15);
  const start = weekStart(S.tracking_start || today()), opening = Number(S.opening_balance_hours ?? 0), curWeek = weekStart(today());
  const tracked = DB.entries.filter(e => e.entry_date >= start);
  const minsBefore = tracked.filter(e => e.entry_date < curWeek).reduce((a, e) => a + e.minutes, 0);
  const minsThis = tracked.filter(e => e.entry_date >= curWeek).reduce((a, e) => a + e.minutes, 0);
  const weeksDone = Math.max(0, Math.round((parseD(curWeek) - parseD(start)) / (7 * 864e5)));
  const carried = opening + minsBefore / 60 - budget * weeksDone, thisH = minsThis / 60;
  return { budget, carried, thisH, needed: Math.max(0, budget - carried - thisH), curWeek };
}
function weeklySeries(n = 8) {
  const cur = weekStart(today()), out = [];
  for (let i = n - 1; i >= 0; i--) { const ws = addDays(cur, -7 * i), we = addDays(ws, 7);
    out.push({ label: fmtD(ws), h: +(DB.entries.filter(e => e.entry_date >= ws && e.entry_date < we).reduce((a, e) => a + e.minutes, 0) / 60).toFixed(2) }); }
  return out;
}
const taskMins = id => DB.entries.filter(e => e.task_id === id).reduce((a, e) => a + e.minutes, 0);

/* ---------- dashboard ---------- */
function renderDashboard() {
  const H = hoursSummary(), t = today(), in7 = addDays(t, 7), open = DB.tasks.filter(x => x.status !== 'Done');
  const needsG = open.filter(x => x.status === 'Needs Dr. G' || x.owner === 'Dr. Ghiassi');
  const waiting = open.filter(x => x.status === 'Waiting' || x.owner === 'Waiting on');
  const dueSoon = open.filter(x => x.due_date && x.due_date <= in7).sort((a, b) => a.due_date.localeCompare(b.due_date));
  const doneWk = DB.tasks.filter(x => x.status === 'Done' && x.completed_at && x.completed_at >= H.curWeek);
  $('#v-dashboard').innerHTML = `
  <div class="grid">
    <div class="stat"><div class="lbl">Hours this week</div><div class="val">${H.thisH.toFixed(2)} <span class="muted" style="font-size:14px">/ ${H.budget}</span></div><div class="sub">Week of ${fmtD(H.curWeek)}</div></div>
    <div class="stat"><div class="lbl">Balance carried in</div><div class="val ${H.carried < 0 ? 'neg' : 'pos'}">${H.carried >= 0 ? '+' : ''}${H.carried.toFixed(2)} h</div><div class="sub">${H.carried < 0 ? 'Hours to recoup' : 'Hours ahead'}</div></div>
    <div class="stat"><div class="lbl">Still needed this week</div><div class="val">${H.needed.toFixed(2)} h</div><div class="sub">To reach the ${H.budget}-hour budget</div></div>
    <div class="stat"><div class="lbl">Open tasks</div><div class="val">${open.length}</div><div class="sub">${doneWk.length} done this week</div></div>
    <div class="stat"><div class="lbl">Needs Dr. Ghiassi</div><div class="val ${needsG.length ? 'neg' : ''}">${needsG.length}</div><div class="sub">${waiting.length} waiting on others</div></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); margin-top:16px">
    <div class="card"><h2>Hours per week (budget ${H.budget})</h2><div class="chartbox"><canvas id="c-weeks"></canvas></div></div>
    <div class="card"><h2>Hours by category (this week)</h2><div class="chartbox"><canvas id="c-cats"></canvas></div></div>
  </div>
  <div class="card"><h2>Needs Dr. Ghiassi</h2>${miniTable(needsG)}</div>
  <div class="card"><h2>Due in the next 7 days</h2>${miniTable(dueSoon)}</div>
  <div class="card"><h2>Waiting on others</h2>${miniTable(waiting, true)}</div>`;
  drawCharts(H);
}
function miniTable(list, showWho) {
  if (!list.length) return '<p class="muted">Nothing here.</p>';
  const t = today();
  return `<table><tr><th>Task</th>${showWho ? '<th>Waiting on</th>' : '<th class="hide-sm">Category</th>'}<th>Due</th><th>Status</th></tr>` +
    list.map(x => `<tr><td>${esc(x.title)}${x.notes ? `<div class="muted" style="font-size:12px">${esc(x.notes)}</div>` : ''}</td>
      ${showWho ? `<td>${esc(x.waiting_on || '')}</td>` : `<td class="hide-sm">${esc(x.category || '')}</td>`}
      <td class="${x.due_date && x.due_date < t ? 'overdue' : ''}">${fmtD(x.due_date)}</td>
      <td><span class="pill ${ST_CLASS[x.status] || ''}">${esc(x.status)}</span></td></tr>`).join('') + '</table>';
}
function drawCharts(H) {
  if (!window.Chart) return;
  Object.values(charts).forEach(c => c.destroy()); charts = {};
  const w = weeklySeries(8);
  charts.w = new Chart($('#c-weeks'), { type: 'bar', data: { labels: w.map(x => x.label), datasets: [
      { label: 'Hours', data: w.map(x => x.h), backgroundColor: w.map(x => x.h >= H.budget ? '#16a34a' : '#2563eb') },
      { label: 'Budget', data: w.map(() => H.budget), type: 'line', borderColor: '#dc2626', borderDash: [6, 4], pointRadius: 0 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
  const byCat = {};
  DB.entries.filter(e => e.entry_date >= H.curWeek).forEach(e => { const c = e.category || (DB.tasks.find(t => t.id === e.task_id) || {}).category || 'Other'; byCat[c] = (byCat[c] || 0) + e.minutes; });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  charts.c = new Chart($('#c-cats'), { type: 'bar', data: { labels: cats.map(c => c[0]), datasets: [{ data: cats.map(c => +(c[1] / 60).toFixed(2)), backgroundColor: '#1f3864' }] },
    options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, title: { display: true, text: 'Hours' } } } } });
}

/* ---------- tasks ---------- */
function renderTasks() {
  const cats = [...new Set(DB.tasks.map(x => x.category).filter(Boolean))].sort(), t = today();
  const list = DB.tasks.filter(x =>
    (filt.status === 'all' || (filt.status === 'open' ? x.status !== 'Done' : x.status === filt.status)) &&
    (!filt.owner || x.owner === filt.owner) && (!filt.category || x.category === filt.category) &&
    (!filt.q || (x.title + ' ' + (x.notes || '') + ' ' + (x.waiting_on || '')).toLowerCase().includes(filt.q.toLowerCase())))
    .sort((a, b) => (a.due_date || '9999').localeCompare(b.due_date || '9999'));
  $('#v-tasks').innerHTML = `<div class="card">
    <div class="filters">
      <input id="f-q" placeholder="Search" value="${esc(filt.q)}">
      <select id="f-status"><option value="open">All open</option><option value="all" ${filt.status === 'all' ? 'selected' : ''}>All (incl. done)</option>${STATUSES.map(s => `<option ${filt.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <select id="f-owner"><option value="">Any owner</option>${OWNERS.map(o => `<option ${filt.owner === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
      <select id="f-cat"><option value="">Any category</option>${cats.map(c => `<option ${filt.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      ${canEdit() ? '<button class="btn" id="add-task">+ Add task</button>' : ''}
    </div>
    <p class="muted">${list.length} task(s)</p>
    <table><tr><th>Task</th><th class="hide-sm">Category</th><th>Owner</th><th>Status</th><th class="hide-sm">Priority</th><th>Due</th><th class="hide-sm">Time</th>${canEdit() ? '<th></th>' : ''}</tr>
    ${list.map(x => `<tr>
      <td>${esc(x.title)}${x.waiting_on ? `<div class="muted" style="font-size:12px">Waiting on: ${esc(x.waiting_on)}</div>` : ''}${x.notes ? `<div class="muted" style="font-size:12px">${esc(x.notes)}</div>` : ''}</td>
      <td class="hide-sm">${esc(x.category || '')}</td><td>${esc(x.owner)}</td>
      <td><span class="pill ${ST_CLASS[x.status] || ''}">${esc(x.status)}</span></td>
      <td class="hide-sm"><span class="pill pr-${esc(x.priority)}">${esc(x.priority)}</span></td>
      <td class="${x.due_date && x.due_date < t && x.status !== 'Done' ? 'overdue' : ''}">${fmtD(x.due_date)}</td>
      <td class="hide-sm">${taskMins(x.id) ? taskMins(x.id) + ' min' : ''}</td>
      ${canEdit() ? `<td class="row-actions"><button class="btn sec sm" data-time="${x.id}">+ Time</button> <button class="btn sec sm" data-edit="${x.id}">Edit</button>${x.status !== 'Done' ? ` <button class="btn sec sm" data-done="${x.id}">Done</button>` : ''}</td>` : ''}
    </tr>`).join('')}</table></div>`;
  $('#f-q').oninput = e => { filt.q = e.target.value; renderTasks(); const q = $('#f-q'); q.focus(); q.setSelectionRange(filt.q.length, filt.q.length); };
  $('#f-status').onchange = e => { filt.status = e.target.value; renderTasks(); };
  $('#f-owner').onchange = e => { filt.owner = e.target.value; renderTasks(); };
  $('#f-cat').onchange = e => { filt.category = e.target.value; renderTasks(); };
  if (canEdit()) {
    $('#add-task').onclick = () => openTask();
    $('#v-tasks').onclick = async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.edit) openTask(DB.tasks.find(x => x.id == b.dataset.edit));
      if (b.dataset.time) openTime(Number(b.dataset.time));
      if (b.dataset.done) { const x = DB.tasks.find(y => y.id == b.dataset.done); x.status = 'Done'; x.completed_at = today(); x.updated_at = today();
        await saveData('Complete task'); render(); }
    };
  }
}
const opts = (arr, v) => arr.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('');
function openTask(x = null) {
  const f = $('#f-task'); f.reset();
  f.owner.innerHTML = opts(OWNERS, x?.owner || 'Gerald'); f.status.innerHTML = opts(STATUSES, x?.status || 'Not started'); f.priority.innerHTML = opts(PRIORITIES, x?.priority || 'Medium');
  ['title', 'category', 'due_date', 'waiting_on', 'notes'].forEach(k => f[k].value = x?.[k] || '');
  $('#dt-title').textContent = x ? 'Edit task' : 'New task';
  $('#dt-del').classList.toggle('hidden', !x);
  $('#dt-del').onclick = async () => { if (!confirm('Delete this task? Its time entries stay in the log.')) return;
    DB.tasks = DB.tasks.filter(y => y.id !== x.id); DB.entries.forEach(e => { if (e.task_id === x.id) e.task_id = null; });
    $('#d-task').close(); await saveData('Delete task'); render(); };
  f.onsubmit = async e => { e.preventDefault();
    const row = { title: f.title.value.trim(), category: f.category.value.trim() || null, owner: f.owner.value, status: f.status.value, priority: f.priority.value,
      due_date: f.due_date.value || null, waiting_on: f.waiting_on.value.trim() || null, notes: f.notes.value.trim() || null, updated_at: today(),
      completed_at: f.status.value === 'Done' ? (x?.completed_at || today()) : null };
    if (x) Object.assign(x, row); else DB.tasks.push({ id: newId(), ...row });
    $('#d-task').close(); await saveData(x ? 'Edit task' : 'Add task'); render(); };
  $('#d-task').showModal();
}
function openTime(taskId = null) {
  const f = $('#f-time'); f.reset();
  f.task_id.innerHTML = '<option value="">(No task / general)</option>' + DB.tasks.filter(x => x.status !== 'Done' || x.id === taskId)
    .map(x => `<option value="${x.id}" ${x.id === taskId ? 'selected' : ''}>${esc(x.title)}</option>`).join('');
  f.entry_date.value = today();
  f.category.value = (DB.tasks.find(x => x.id === taskId) || {}).category || '';
  f.task_id.onchange = () => { const t2 = DB.tasks.find(x => x.id == f.task_id.value); if (t2) f.category.value = t2.category || ''; };
  f.querySelectorAll('.qm').forEach(b => b.onclick = () => f.minutes.value = (Number(f.minutes.value) || 0) + Number(b.dataset.m));
  f.onsubmit = async e => { e.preventDefault();
    DB.entries.push({ id: newId(), task_id: f.task_id.value ? Number(f.task_id.value) : null, entry_date: f.entry_date.value,
      minutes: Number(f.minutes.value), category: f.category.value.trim() || null, note: f.note.value.trim() || null });
    $('#d-time').close(); await saveData('Log time'); render(); };
  $('#d-time').showModal();
}

/* ---------- time log ---------- */
function renderTime() {
  const H = hoursSummary(), byDay = {};
  DB.entries.forEach(e => (byDay[e.entry_date] ||= []).push(e));
  const days = Object.keys(byDay).sort().reverse().slice(0, 21);
  $('#v-time').innerHTML = `<div class="card"><div class="filters"><span class="muted">This week: ${H.thisH.toFixed(2)} h · Balance carried in: ${H.carried.toFixed(2)} h · Still needed: ${H.needed.toFixed(2)} h</span></div>
    ${days.length ? days.map(d => { const tot = byDay[d].reduce((a, e) => a + e.minutes, 0);
      return `<h2 style="margin-top:14px">${parseD(d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })} · ${tot} min (${(tot / 60).toFixed(2)} h)</h2>
      <table>${byDay[d].map(e => `<tr><td>${esc((DB.tasks.find(t => t.id === e.task_id) || {}).title || '(general)')}${e.note ? `<div class="muted" style="font-size:12px">${esc(e.note)}</div>` : ''}</td>
        <td class="hide-sm">${esc(e.category || '')}</td><td>${e.minutes} min</td></tr>`).join('')}</table>`; }).join('')
      : '<p class="muted">No time logged yet.</p>'}</div>`;
}

/* ---------- users ---------- */
function renderUsers() {
  $('#v-users').innerHTML = `<div class="card"><h2>Add a user</h2>
    <div class="filters"><input id="nu-name" placeholder="Full name"><input id="nu-user" placeholder="Username">
    <input id="nu-pass" placeholder="Passcode (8+ characters)"><select id="nu-role"><option>viewer</option><option>admin</option></select>
    <button class="btn" id="nu-btn">Add user</button></div><div class="err" id="nu-err"></div>
    <p class="muted">Send the person the link, their username and passcode.</p></div>
    <div class="card"><h2>Users</h2><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Active</th><th></th></tr>
    ${DB.users.map((u, i) => `<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td>
      <td><select data-role="${i}" ${u.username === me.username ? 'disabled' : ''}>${opts(['viewer', 'admin'], u.role)}</select></td>
      <td><input type="checkbox" data-act="${i}" ${u.active !== false ? 'checked' : ''} ${u.username === me.username ? 'disabled' : ''}></td>
      <td><button class="btn sec sm" data-reset="${i}">Set passcode</button> ${u.username !== me.username ? `<button class="btn sec sm" data-rm="${i}">Remove</button>` : ''}</td></tr>`).join('')}</table></div>`;
  $('#nu-btn').onclick = async () => {
    const name = $('#nu-name').value.trim(), user = $('#nu-user').value.trim(), pass = $('#nu-pass').value, role = $('#nu-role').value;
    if (!user || pass.length < 8) return $('#nu-err').textContent = 'Enter a username and a passcode of at least 8 characters.';
    if (DB.users.some(u => u.username.toLowerCase() === user.toLowerCase())) return $('#nu-err').textContent = 'That username already exists.';
    DB.users.push({ name, username: user, role, active: true, pass_hash: await hash(user, pass) });
    if (await saveData('Add user')) { render(); alert(`User added: ${user}`); }
  };
  $('#v-users').onchange = async e => {
    if (e.target.dataset.role) DB.users[e.target.dataset.role].role = e.target.value;
    else if (e.target.dataset.act) DB.users[e.target.dataset.act].active = e.target.checked; else return;
    await saveData('Update user');
  };
  $('#v-users').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.reset) { const u = DB.users[b.dataset.reset]; const p = prompt(`New passcode for ${u.username} (8+ characters):`);
      if (!p) return; if (p.length < 8) return alert('Passcode must be at least 8 characters.');
      u.pass_hash = await hash(u.username, p); if (await saveData('Set passcode')) alert('Passcode updated.'); }
    if (b.dataset.rm) { const u = DB.users[b.dataset.rm]; if (!confirm(`Remove ${u.username}?`)) return;
      DB.users.splice(b.dataset.rm, 1); await saveData('Remove user'); render(); }
  };
}

/* ---------- settings ---------- */
function renderSettings() {
  const S = DB.settings, fields = [['weekly_budget_hours', 'Weekly hours budget'], ['week_start_day', 'Week starts on (0 = Sunday, 1 = Monday)'],
    ['tracking_start', 'Tracking start date (YYYY-MM-DD)'], ['opening_balance_hours', 'Opening balance in hours (negative = to recoup)']];
  $('#v-settings').innerHTML = `<div class="card"><h2>Hours settings</h2>
    ${fields.map(([k, l]) => `<label class="muted" style="display:block;margin-top:10px">${l}</label><input data-k="${k}" value="${esc(S[k] ?? '')}">`).join('')}
    <div class="actions" style="justify-content:flex-start"><button class="btn" id="set-save">Save</button></div></div>
    <div class="card"><h2>GitHub token on this device</h2><p class="muted">${token() ? 'A token is saved on this device.' : 'No token saved. Changes cannot be saved from this device.'}</p>
    <div class="filters"><input id="tok" type="password" placeholder="Paste new token" style="min-width:280px"><button class="btn" id="tok-save">Save token</button><button class="btn sec" id="tok-del">Remove token</button></div></div>`;
  $('#set-save').onclick = async () => {
    document.querySelectorAll('#v-settings [data-k]').forEach(i => { const v = i.value.trim(); S[i.dataset.k] = (i.dataset.k === 'tracking_start') ? v : Number(v); });
    if (await saveData('Update settings')) alert('Saved.');
  };
  $('#tok-save').onclick = () => { const v = $('#tok').value.trim(); if (v) { store.set('va_gh_token', v); alert('Token saved on this device.'); render(); } };
  $('#tok-del').onclick = () => { store.del('va_gh_token'); render(); };
}

boot();
</script>
</body>
</html>
