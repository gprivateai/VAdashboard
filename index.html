<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VA Task Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --brand:#1f3864; --red:#dc2626; --green:#16a34a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  header { background:var(--brand); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header .who { font-size:12px; opacity:.85; }
  nav { display:flex; gap:4px; padding:8px 16px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav button { background:none; border:0; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:14px; color:var(--ink); }
  nav button.on { background:#e8edf6; color:var(--brand); font-weight:bold; }
  main { padding:16px; max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .stat .lbl { color:var(--muted); font-size:12px; } .stat .val { font-size:26px; font-weight:bold; margin-top:4px; } .stat .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .neg { color:var(--red); } .pos { color:var(--green); }
  h2 { font-size:15px; margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; white-space:nowrap; }
  .st-ns { background:#eef2f7; color:#374151; } .st-ip { background:#dbeafe; color:#1e40af; } .st-w { background:#fef3c7; color:#92400e; }
  .st-g { background:#fee2e2; color:#991b1b; } .st-d { background:#dcfce7; color:#166534; }
  .pr-High { background:#fee2e2; color:#991b1b; } .pr-Medium { background:#fef3c7; color:#92400e; } .pr-Low { background:#eef2f7; color:#374151; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
  input, select, textarea { font:inherit; padding:7px 9px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; }
  textarea { width:100%; min-height:70px; }
  .btn { background:var(--brand); color:#fff; border:0; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:14px; }
  .btn.sec { background:#e5e7eb; color:var(--ink); } .btn.danger { background:var(--red); } .btn.sm { padding:4px 8px; font-size:12px; }
  .row-actions { white-space:nowrap; } .muted { color:var(--muted); } .overdue { color:var(--red); font-weight:bold; }
  dialog { border:0; border-radius:12px; padding:0; width:min(560px,94vw); }
  dialog form { padding:18px; } dialog label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; } dialog input, dialog select { width:100%; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .gate { max-width:380px; margin:10vh auto; } .gate input { width:100%; margin-bottom:10px; }
  .err { color:var(--red); font-size:13px; min-height:18px; }
  .chartbox { position:relative; height:260px; }
  .hidden { display:none !important; }
  .saving { position:fixed; bottom:16px; right:16px; background:#111827; color:#fff; padding:8px 12px; border-radius:8px; font-size:13px; }
  @media (max-width:700px){ .hide-sm { display:none; } th, td { padding:6px 4px; } main { padding:12px; } .grid { grid-template-columns:1fr 1fr; gap:8px; } .stat { padding:10px; } .stat .val { font-size:20px; } }
</style>
</head>
<body>

<div id="gate-login" class="card gate hidden">
  <h2>VA Task Dashboard</h2>
  <input id="li-user" placeholder="Username" autocomplete="username">
  <input id="li-pass" type="password" placeholder="Passcode" autocomplete="current-password">
  <div class="err" id="li-err"></div>
  <button class="btn" id="li-btn" style="width:100%">Sign in</button>
</div>



<div id="app" class="hidden">
  <header>
    <h1>VA Task Dashboard</h1>
    <span class="who" id="who"></span>
    <button class="btn sec sm" id="out-btn">Sign out</button>
  </header>
  <nav id="nav"></nav>
  <main>
    <section id="v-dashboard"></section>
    <section id="v-tasks" class="hidden"></section>
    <section id="v-eod" class="hidden"></section>
    <section id="v-time" class="hidden"></section>
    <section id="v-payments" class="hidden"></section>
    <section id="v-users" class="hidden"></section>
    <section id="v-settings" class="hidden"></section>
  </main>
</div>
<div id="saving" class="saving hidden">Saving…</div>

<dialog id="d-task"><form id="f-task">
  <h2 id="dt-title">Task</h2>
  <label>Task</label><input name="title" required>
  <div class="two"><div><label>Category</label><input name="category" list="cats"></div><div><label>Owner</label><select name="owner"></select></div></div>
  <div class="two"><div><label>Status</label><select name="status"></select></div><div><label>Priority</label><select name="priority"></select></div></div>
  <div class="two"><div><label>Due date</label><input name="due_date" type="date"></div><div><label>Waiting on (person)</label><input name="waiting_on"></div></div>
  <label>Notes</label><textarea name="notes"></textarea>
  <div class="actions">
    <button type="button" class="btn danger hidden" id="dt-del">Delete</button>
    <button type="button" class="btn sec" onclick="this.closest('dialog').close()">Cancel</button>
    <button class="btn">Save</button>
  </div>
</form></dialog>

<dialog id="d-time"><form id="f-time">
  <h2>Add to EOD</h2>
  <label>Task</label><select name="task_id"></select>
  <div class="two"><div><label>Date</label><input name="entry_date" type="date" required></div><div><label>Minutes (can fill in at EOD)</label><input name="minutes" type="number" min="1" step="1"></div></div>
  <div style="margin-top:6px">
    <button type="button" class="btn sec sm qm" data-m="5">+5</button> <button type="button" class="btn sec sm qm" data-m="10">+10</button>
    <button type="button" class="btn sec sm qm" data-m="15">+15</button> <button type="button" class="btn sec sm qm" data-m="30">+30</button>
    <button type="button" class="btn sec sm qm" data-m="60">+60</button>
  </div>
  <label>Category (for analytics)</label><input name="category" list="cats">
  <label>What was done (shows in the EOD)</label><input name="note" required>
  <div class="actions"><button type="button" class="btn sec" onclick="this.closest('dialog').close()">Cancel</button><button class="btn">Save</button></div>
</form></dialog>
<dialog id="d-ask"><form method="dialog" style="padding:18px">
  <p id="ask-msg" style="margin:0 0 10px;white-space:pre-wrap"></p>
  <input id="ask-in" class="hidden" style="width:100%"><textarea id="ask-ta" class="hidden" readonly style="min-height:200px"></textarea>
  <div class="actions"><button type="button" class="btn sec" id="ask-cancel">Cancel</button><button type="button" class="btn" id="ask-ok">OK</button></div>
</form></dialog>
<datalist id="cats"></datalist>

<script>
/* ===== CONFIG ===== */
const GH_OWNER = 'gprivateai';
const GH_REPO = 'VAdashboard';
const GH_BRANCH = 'main';
const DATA_PATH = 'data.json';
/* ================== */

const OWNERS = ['Gerald', 'Dr. Ghiassi', 'Waiting on'];
const STATUSES = ['Not started', 'In progress', 'Waiting', 'Needs Dr. G', 'Done'];
const PRIORITIES = ['High', 'Medium', 'Low'];
const ST_CLASS = {'Not started':'st-ns','In progress':'st-ip','Waiting':'st-w','Needs Dr. G':'st-g','Done':'st-d'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DB = null, fileSha = null, me = null, view = 'dashboard', charts = {};
const filt = { q:'', status:'open', owner:'', category:'' };

/* ---------- storage helpers (wrapped: may be blocked) ---------- */
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} }, del(k){ try { localStorage.removeItem(k); } catch {} } };
const sess = { get(k){ try { return sessionStorage.getItem(k); } catch { return null; } }, set(k,v){ try { sessionStorage.setItem(k,v); } catch {} }, del(k){ try { sessionStorage.removeItem(k); } catch {} } };
/* ---------- data ----------
   In Claude (admin): data lives in the artifact database (doc state/main) and saves there.
   On GitHub Pages: read-only, loads data.json next to this file. */
let stateRef = null;
async function claudeUse(name) { try { return (window.claude && window.claude.use) ? await window.claude.use(name) : null; } catch { return null; } }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
async function fetchFile() {
  const r = await fetch(`data.json?t=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error('Could not load data.json');
  return r.json();
}
async function loadData() {
  const db = await claudeUse('db');
  if (db) {
    try {
      stateRef = db.doc('state/main');
      const snap = await withTimeout(stateRef.get(), 10000);
      if (snap.exists) { DB = structuredClone(snap.data()); startLive(); return; }
    } catch { stateRef = null; }
  }
  DB = await fetchFile();
}
/* live sync: pick up changes saved elsewhere (another tab, or Claude) so a later save doesn't overwrite them */
let liveUnsub = null, renderLater = false;
function startLive() {
  if (!stateRef || liveUnsub || typeof stateRef.onSnapshot !== 'function') return;
  liveUnsub = stateRef.onSnapshot(snap => {
    if (!snap.exists || snap.metadata?.hasPendingWrites || snap.metadata?.fromCache) return;
    const nd = snap.data(); if (JSON.stringify(nd) === JSON.stringify(DB)) return;
    DB = structuredClone(nd);
    if (!me) return;
    if (document.querySelector('dialog[open]') || document.activeElement?.matches('input,textarea,select')) renderLater = true; else render();
  }, () => {});
  document.addEventListener('focusout', () => setTimeout(() => { if (renderLater && !document.querySelector('dialog[open]')) { renderLater = false; render(); } }, 300));
}
async function saveData() {
  if (!stateRef) { alertA('This copy is read-only. Make changes in the Claude version of the dashboard.'); return false; }
  $('#saving').classList.remove('hidden');
  try { await stateRef.set(DB); return true; }
  catch (e) { alertA('Save failed: ' + (e.message || e.code || e) + '. Reload the page and try again.'); return false; }
  finally { $('#saving').classList.add('hidden'); }
}
async function exportJson() {
  const text = JSON.stringify(DB, null, 1), dl = await claudeUse('downloads');
  if (dl) { try { await dl.save({ filename: 'data.json', data: text }); return; } catch (e) { if (e && e.code !== 'unavailable') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = 'data.json'; a.click();
}

/* ---------- in-page dialogs (browser pop-ups are blocked inside Claude) ---------- */
function ask(msg, o = {}) {
  return new Promise(res => {
    const d = $('#d-ask'), inp = $('#ask-in'), ta = $('#ask-ta');
    $('#ask-msg').textContent = msg; inp.value = ''; ta.value = o.text || '';
    inp.classList.toggle('hidden', !o.input); ta.classList.toggle('hidden', !o.text); $('#ask-cancel').classList.toggle('hidden', !!o.ok);
    const done = v => { d.close(); res(v); };
    $('#ask-ok').onclick = () => done(o.input ? inp.value : true);
    $('#ask-cancel').onclick = () => done(o.input ? null : false);
    d.oncancel = e => { e.preventDefault(); done(o.input ? null : false); };
    d.querySelector('form').onsubmit = e => { e.preventDefault(); $('#ask-ok').click(); };
    d.showModal(); if (o.input) inp.focus(); if (o.text) ta.select();
  });
}
const confirmA = m => ask(m), alertA = m => ask(m, { ok: true }), promptA = m => ask(m, { input: true });

/* ---------- passcodes ---------- */
async function hash(user, pass) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`va-dash|${user.toLowerCase()}|${pass}`));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
function weekStart(s) { const d = parseD(s); const sd = Number(DB.settings.week_start_day ?? 1); d.setDate(d.getDate() - ((d.getDay() - sd + 7) % 7)); return ymd(d); }
const fmtD = s => s ? parseD(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

/* ---------- boot / auth ---------- */
async function boot() {
  try { await loadData(); } catch (e) { document.body.innerHTML = `<div class="card gate"><h2>Can't load data</h2><p>${esc(e.message)}</p></div>`; return; }
  if (!DB.users || !DB.users.length) { document.body.innerHTML = '<div class="card gate"><h2>Not set up yet</h2><p class="muted">No users in data.json.</p></div>'; return; }
  const u = sess.get('va_user'); me = DB.users.find(x => x.username === u && x.active !== false);
  if (!me) return show('#gate-login');
  startApp();
}
function show(id) { ['#gate-login', '#app'].forEach(x => $(x).classList.add('hidden')); $(id).classList.remove('hidden'); }
$('#li-btn').onclick = async () => {
  const user = $('#li-user').value.trim(), pass = $('#li-pass').value; $('#li-err').textContent = '';
  const u = DB.users.find(x => x.username.toLowerCase() === user.toLowerCase());
  if (!u || u.active === false || u.pass_hash !== await hash(u.username, pass)) return $('#li-err').textContent = 'Wrong username or passcode.';
  sess.set('va_user', u.username); me = u; startApp();
};
$('#li-pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('#li-btn').click(); });

$('#out-btn').onclick = () => { sess.del('va_user'); location.reload(); };
const isAdmin = () => me && me.role === 'admin';
const canEdit = () => isAdmin() && !!stateRef;

function startApp() {
  show('#app'); $('#who').textContent = `${me.name || me.username} · ${me.role}`;
  const items = [['dashboard', 'Dashboard'], ['tasks', 'Tasks']];
  if (canEdit()) items.push(['eod', 'EOD']);
  if (isAdmin()) items.push(['time', 'Time log'], ['payments', 'Payments']);
  if (canEdit()) items.push(['users', 'Users'], ['settings', 'Settings']);
  $('#nav').innerHTML = items.map(([k, l]) => `<button data-v="${k}">${l}</button>`).join('');
  $('#nav').onclick = e => { const v = e.target.dataset.v; if (v) { view = v; render(); } };
  render();
}
function render() {
  $('#cats').innerHTML = [...new Set(DB.tasks.map(x => x.category).filter(Boolean))].sort().map(c => `<option value="${esc(c)}">`).join('');
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
  $('#v-' + view).classList.remove('hidden');
  ({ dashboard: renderDashboard, tasks: renderTasks, eod: renderEod, time: renderTime, payments: renderPayments, users: renderUsers, settings: renderSettings })[view]();
}
const newId = () => DB.next_id++;

/* ---------- hours ---------- */
function hoursSummary(ws) {
  const S = DB.settings, budget = Number(S.weekly_budget_hours ?? 15), nowWeek = weekStart(today());
  const start = weekStart(S.tracking_start || today()), opening = Number(S.opening_balance_hours ?? 0), curWeek = ws || nowWeek, weekEnd = addDays(curWeek, 7);
  const tracked = DB.entries.filter(e => e.entry_date >= start);
  const minsBefore = tracked.filter(e => e.entry_date < curWeek).reduce((a, e) => a + e.minutes, 0);
  const minsThis = DB.entries.filter(e => e.entry_date >= curWeek && e.entry_date < weekEnd).reduce((a, e) => a + e.minutes, 0);
  const weeksDone = Math.max(0, Math.round((parseD(curWeek) - parseD(start)) / (7 * 864e5)));
  const carried = opening + minsBefore / 60 - budget * weeksDone, thisH = minsThis / 60;
  return { budget, carried, thisH, needed: Math.max(0, budget - carried - thisH), curWeek, weekEnd,
    isCurrent: curWeek === nowWeek, preTracking: curWeek < start, after: carried + thisH - budget };
}
function weekOptions() {
  const now = weekStart(today()), dates = DB.entries.map(e => e.entry_date).concat([DB.settings.tracking_start || today()]).sort();
  let w = weekStart(dates[0] < now ? dates[0] : now); const out = [];
  while (w <= now) { out.unshift(w); w = addDays(w, 7); }
  return out;
}
const weekLabel = ws => `${fmtD(ws)} – ${fmtD(addDays(ws, 6))}`;
let selWeek = null;
function weeklySeries(n = 8) {
  const cur = weekStart(today()), out = [];
  for (let i = n - 1; i >= 0; i--) { const ws = addDays(cur, -7 * i), we = addDays(ws, 7);
    out.push({ label: fmtD(ws), h: +(DB.entries.filter(e => e.entry_date >= ws && e.entry_date < we).reduce((a, e) => a + e.minutes, 0) / 60).toFixed(2) }); }
  return out;
}
function weekWorked(ws) { const we = addDays(ws, 7); return DB.entries.filter(e => e.entry_date >= ws && e.entry_date < we).reduce((a, e) => a + e.minutes, 0) / 60; }
function paySummary() {
  const rows = [...(DB.payments || [])].sort((a, b) => a.week_start.localeCompare(b.week_start)); let run = 0;
  const out = rows.map(p => { const worked = (p.hours_worked !== null && p.hours_worked !== undefined && p.hours_worked !== '') ? Number(p.hours_worked) : weekWorked(p.week_start);
    const diff = worked - Number(p.hours_paid || 0); run += diff; return { ...p, worked, diff, run }; });
  return { rows: out, balance: run, paidTotal: rows.reduce((a, p) => a + Number(p.hours_paid || 0), 0) };
}
const sgn = n => (n >= 0 ? '+' : '') + n.toFixed(2);
function renderPayments() {
  const P = paySummary();
  $('#v-payments').innerHTML = `
  <div class="grid"><div class="stat"><div class="lbl">Hours paid (all weeks)</div><div class="val">${P.paidTotal.toFixed(2)} h</div><div class="sub">${P.rows.length} week(s) recorded</div></div>
  <div class="stat"><div class="lbl">Worked vs paid</div><div class="val ${P.balance < 0 ? 'neg' : 'pos'}">${sgn(P.balance)} h</div><div class="sub">${P.balance < -0.004 ? 'Paid but not yet worked: to recoup' : P.balance > 0.004 ? 'Worked beyond what was paid' : 'Even: paid hours match hours worked'}</div></div></div>
  ${canEdit() ? `<div class="card" style="margin-top:16px"><h2>Record a payment</h2><div class="filters">
    <label class="muted">Week starting <input id="pw" type="date"></label>
    <label class="muted">Hours paid <input id="ph" type="number" step="0.01" min="0" style="width:90px" value="${esc(DB.settings.weekly_budget_hours ?? 15)}"></label>
    <label class="muted">Paid on <input id="pd" type="date"></label>
    <label class="muted">Hours worked <input id="pk" type="number" step="0.01" min="0" style="width:90px"></label><span class="muted" id="pk-src"></span>
    <input id="pn" placeholder="Note (e.g. 15-hour minimum)" style="min-width:220px"><button class="btn" id="p-add">Save</button></div><div class="err" id="p-err"></div></div>` : ''}
  <div class="card" style="margin-top:16px"><h2>Payments by week</h2>${P.rows.length ? `<table><tr><th>Week of</th><th>Worked</th><th>Paid</th><th>Difference</th><th>Running balance</th><th class="hide-sm">Paid on</th><th class="hide-sm">Note</th>${canEdit() ? '<th></th>' : ''}</tr>
    ${P.rows.slice().reverse().map(p => `<tr><td>${fmtD(p.week_start)}</td><td>${p.worked.toFixed(2)} h</td><td>${canEdit() ? `<input type="number" step="0.01" min="0" style="width:80px" data-ph="${p.id}" value="${Number(p.hours_paid)}"> h` : `${Number(p.hours_paid).toFixed(2)} h`}</td>
      <td class="${p.diff < 0 ? 'neg' : 'pos'}">${sgn(p.diff)}</td><td class="${p.run < 0 ? 'neg' : 'pos'}">${sgn(p.run)}</td>
      <td class="hide-sm">${p.paid_on ? fmtD(p.paid_on) : '<span class="muted">Not yet</span>'}</td><td class="hide-sm">${canEdit() ? `<input data-pnote="${p.id}" value="${esc(p.note || '')}" style="min-width:160px">` : esc(p.note || '')}</td>
      ${canEdit() ? `<td class="row-actions">${p.paid_on ? '' : `<button class="btn sec sm" data-paid="${p.id}">Mark paid today</button> `}<button class="btn sec sm" data-pdel="${p.id}">Remove</button></td>` : ''}</tr>`).join('')}</table>` : '<p class="muted">No payments recorded yet.</p>'}</div>`;
  if (!canEdit()) return;
  const pw = $('#pw');
  pw.onchange = () => {
    if (!pw.value) return; const ws = weekStart(pw.value), logged = weekWorked(ws), ex = (DB.payments || []).find(p => p.week_start === ws);
    if (ws !== pw.value) pw.value = ws;
    $('#pk').value = logged ? logged.toFixed(2) : (ex && ex.hours_worked != null ? ex.hours_worked : '');
    $('#pk-src').textContent = logged ? `From the time log (${weekLabel(ws)})` : `Nothing logged for ${weekLabel(ws)}: enter hours`;
    if (ex) { $('#ph').value = ex.hours_paid; $('#pd').value = ex.paid_on || ''; $('#pn').value = ex.note || ''; $('#pk-src').textContent += ' · editing the existing record'; }
  };
  $('#p-add').onclick = async () => {
    const w = pw.value, h = $('#ph').value; if (!w || h === '') return $('#p-err').textContent = 'Enter the week and hours paid.';
    const ws = weekStart(w), logged = weekWorked(ws), k = $('#pk').value;
    const rec = { week_start: ws, hours_paid: Number(h), hours_worked: logged ? null : (k === '' ? null : Number(k)), paid_on: $('#pd').value || null, note: $('#pn').value.trim() || null };
    const ex = (DB.payments ||= []).find(p => p.week_start === ws);
    if (ex) Object.assign(ex, rec); else DB.payments.push({ id: newId(), ...rec });
    await saveData(); render(); };

const mdy = s => { const [y, m, d] = s.split('-'); return `${m}/${d}/${y}`; };
const lineText = l => l.note || (DB.tasks.find(t => t.id === l.task_id) || {}).title || '';
const lineCat = l => l.category || (DB.tasks.find(t => t.id === l.task_id) || {}).category || 'Other';

    ${days.length ? days.map(d => `<h2 style="margin-top:14px">${parseD(d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</h2>

        <td class="hide-sm"><input data-cat="${l.id}" list="cats" value="${esc(lineCat(l))}" style="width:140px"></td>
        <td><input type="number" min="1" step="1" style="width:80px" data-min="${l.id}" value="${l.minutes ?? ''}" placeholder="min"></td>
        <td><button class="btn sec sm" data-ldel="${l.id}">Remove</button></td></tr>`).join('')}</table>`).join('')
      : '<p class="muted">Nothing waiting. Use + Add work, or + EOD on a task, as you go.</p>'}
    ${P.length ? `<div class="filters" style="margin-top:16px">
      <button class="btn sec" id="eod-copy">Copy EOD text</button><button class="btn sec" id="eod-csv">Download CSV</button>
      <label class="muted">Sent on <input id="eod-date" type="date" value="${today()}"></label>
      <button class="btn" id="eod-send">Mark EOD sent</button></div><div class="err" id="eod-err"></div>` : ''}</div>
  <div class="card"><h2>Sent EODs</h2>${sent.length ? `<table><tr><th>Sent</th><th>Days covered</th><th>Lines</th><th>Hours</th></tr>
    ${sent.map(r => `<tr><td>${fmtD(r.sent_on)}</td><td>${r.dates.map(fmtD).join(', ')}</td><td>${r.lines}</td><td>${(r.minutes / 60).toFixed(2)}</td></tr>`).join('')}</table>` : '<p class="muted">None yet.</p>'}</div>`;
  $('#eod-add').onclick = () => openTime();
  const v = $('#v-eod');
  v.onchange = async e => { const ds = e.target.dataset, id = ds.min || ds.note || ds.cat; if (!id) return; const l = P.find(x => x.id == id); if (!l) return;
    if (ds.min) { const m = Number(e.target.value); l.minutes = m > 0 ? Math.round(m) : null; }
    else if (ds.note) { const t = e.target.value.trim(); if (!t) { e.target.value = lineText(l); return; } l.note = t; }
    else { l.category = e.target.value.trim() || null; }

  v.onclick = async e => { const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.ldel) { if (!(await confirmA('Remove this line?'))) return; DB.eod_pending = P.filter(x => x.id != b.dataset.ldel); await saveData(); render(); }
    if (b.id === 'eod-copy') { const txt = days.map(d => `${mdy(d)}\n✅ Completed\n` + byDay[d].map(l => `• ${lineText(l)}`).join('\n')).join('\n\n');
      try { await navigator.clipboard.writeText(txt); alertA('EOD text copied.'); } catch { ask('Copy the EOD text (it is selected; press Ctrl+C):', { ok: true, text: txt }); } }
    if (b.id === 'eod-csv') { const q = x => /[",\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x;
      const csv = days.flatMap(d => byDay[d].map(l => [mdy(d), lineCat(l), lineText(l)].map(q).join(','))).join('\n') + '\n';
      const dl = await claudeUse('downloads'), name = `eod_${days[days.length - 1]}.csv`;

    if (b.id === 'eod-send') {
      if (P.some(l => !l.minutes)) return $('#eod-err').textContent = 'Add minutes to every line before marking the EOD sent.';
      const sentOn = $('#eod-date').value || today();
      if (!(await confirmA(`Mark the EOD sent on ${fmtD(sentOn)}? ${P.length} line(s), ${(tot / 60).toFixed(2)} h move to the time log.`))) return;
      P.forEach(l => DB.entries.push({ ...l, eod_sent: sentOn }));
      (DB.eod_reports ||= []).push({ id: newId(), sent_on: sentOn, dates: days, lines: P.length, minutes: tot });
      DB.eod_pending = []; await saveData(); render(); } };
}

/* ---------- time log ---------- */
function renderTime() {
  const H = hoursSummary(), byDay = {};
  DB.entries.forEach(e => (byDay[e.entry_date] ||= []).push(e));
  const days = Object.keys(byDay).sort().reverse().slice(0, 21);
  $('#v-time').innerHTML = `<div class="card"><div class="filters">
    <span class="muted">Logged from sent EODs. This week: ${H.thisH.toFixed(2)} h · Balance carried in: ${H.carried.toFixed(2)} h · Still needed: ${H.needed.toFixed(2)} h</span></div>
    ${days.length ? days.map(d => { const tot = byDay[d].reduce((a, e) => a + e.minutes, 0);
      return `<h2 style="margin-top:14px">${parseD(d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })} · ${tot} min (${(tot / 60).toFixed(2)} h)</h2>
      <table>${byDay[d].map(e => `<tr><td>${esc((DB.tasks.find(t => t.id === e.task_id) || {}).title || '(general)')}${e.note ? `<div class="muted" style="font-size:12px">${esc(e.note)}</div>` : ''}</td>
        <td class="hide-sm">${esc(e.category || '')}</td><td>${e.minutes} min</td>${canEdit() ? `<td><button class="btn sec sm" data-del="${e.id}">Remove</button></td>` : ''}</tr>`).join('')}</table>`; }).join('')
      : '<p class="muted">No time logged yet.</p>'}</div>`;
  if (!canEdit()) return;
  $('#v-time').onclick = async e => { const b = e.target.closest('[data-del]'); if (!b || !(await confirmA('Remove this time entry?'))) return;
    DB.entries = DB.entries.filter(x => x.id != b.dataset.del); await saveData('Remove time entry'); render(); };
}

/* ---------- users ---------- */
function renderUsers() {
  $('#v-users').innerHTML = `<div class="card"><h2>Add a user</h2>
    <div class="filters"><input id="nu-name" placeholder="Full name"><input id="nu-user" placeholder="Username">
    <input id="nu-pass" placeholder="Passcode (4+ characters)"><select id="nu-role"><option>viewer</option><option>admin</option></select>
    <button class="btn" id="nu-btn">Add user</button></div><div class="err" id="nu-err"></div>
    <p class="muted">Send the person the link, their username and passcode.</p></div>
    <div class="card"><h2>Users</h2><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Active</th><th></th></tr>
    ${DB.users.map((u, i) => `<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td>
      <td><select data-role="${i}" ${u.username === me.username ? 'disabled' : ''}>${opts(['viewer', 'admin'], u.role)}</select></td>
      <td><input type="checkbox" data-act="${i}" ${u.active !== false ? 'checked' : ''} ${u.username === me.username ? 'disabled' : ''}></td>
      <td><button class="btn sec sm" data-reset="${i}">Set passcode</button> ${u.username !== me.username ? `<button class="btn sec sm" data-rm="${i}">Remove</button>` : ''}</td></tr>`).join('')}</table></div>`;
  $('#nu-btn').onclick = async () => {
    const name = $('#nu-name').value.trim(), user = $('#nu-user').value.trim(), pass = $('#nu-pass').value, role = $('#nu-role').value;
    $('#nu-err').textContent = '';
    if (!user || pass.trim().length < 4) return $('#nu-err').textContent = 'Enter a username and a passcode of at least 4 characters.';
    if (DB.users.some(u => u.username.toLowerCase() === user.toLowerCase())) return $('#nu-err').textContent = 'That username already exists.';
    DB.users.push({ name, username: user, role, active: true, pass_hash: await hash(user, pass) });
    if (await saveData('Add user')) { render(); alertA(`User added: ${user}`); }
  };
  $('#v-users').onchange = async e => {
    if (e.target.dataset.role) DB.users[e.target.dataset.role].role = e.target.value;
    else if (e.target.dataset.act) DB.users[e.target.dataset.act].active = e.target.checked; else return;
    await saveData('Update user');
  };
  $('#v-users').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.reset) { const u = DB.users[b.dataset.reset]; const p = await promptA(`New passcode for ${u.username} (4+ characters):`);
      if (!p) return; if (p.length < 4) return alertA('Passcode must be at least 4 characters.');
      u.pass_hash = await hash(u.username, p); if (await saveData('Set passcode')) alertA('Passcode updated.'); }
    if (b.dataset.rm) { const u = DB.users[b.dataset.rm]; if (!(await confirmA(`Remove ${u.username}?`))) return;
      DB.users.splice(b.dataset.rm, 1); await saveData('Remove user'); render(); }
  };
}

/* ---------- settings ---------- */
function renderSettings() {
  const S = DB.settings, fields = [['weekly_budget_hours', 'Weekly hours budget'], ['week_start_day', 'Week starts on (0 = Sunday, 1 = Monday)'],
    ['tracking_start', 'Tracking start date (YYYY-MM-DD)'], ['opening_balance_hours', 'Opening balance in hours (negative = to recoup)']];
  $('#v-settings').innerHTML = `<div class="card"><h2>Hours settings</h2>
    ${fields.map(([k, l]) => `<label class="muted" style="display:block;margin-top:10px">${l}</label><input data-k="${k}" value="${esc(S[k] ?? '')}">`).join('')}
    <div class="actions" style="justify-content:flex-start"><button class="btn" id="set-save">Save</button></div></div>
    <div class="card"><h2>Update Dr. Ghiassi's GitHub copy</h2><p class="muted">Her view on GitHub reads data.json. After changes, download it and upload it to the VAdashboard repo (Add file > Upload files > Commit).</p>
    <button class="btn" id="exp-btn">Download data.json</button></div>`;
  $('#set-save').onclick = async () => {
    document.querySelectorAll('#v-settings [data-k]').forEach(i => { const v = i.value.trim(); S[i.dataset.k] = (i.dataset.k === 'tracking_start') ? v : Number(v); });
    if (await saveData('Update settings')) alertA('Saved.');
  };
  $('#exp-btn').onclick = exportJson;
}

boot();
</script>
</body>
